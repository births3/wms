# 详细规则：见 docs/governance.md §2.3 治理脚本约定（v0.4）

# ============================================================
# check_doc_links.py — 附录跨模块引用规则
# ============================================================
# 格式：每个附录定义在哪个文件，期望被哪些故事文件引用
# 缺一报告（违反"附录必须被使用方引用"原则）

[[appendix_references]]
