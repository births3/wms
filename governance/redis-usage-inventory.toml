version = 1

[[entry]]
path = "backend/Cargo.toml"
category = "dependency"
required_terms = ["redis ="]

[[entry]]
path = "backend/Cargo.lock"
category = "dependency-lock"
required_terms = ["name = \"redis\""]

[[entry]]
path = "backend/crates/api/Cargo.toml"
category = "dependency-consumer"
required_terms = ["redis.workspace = true"]

[[entry]]
path = "backend/crates/api/src/auth.rs"
category = "runtime-auth-revocation"
required_terms = ["RedisAuthRevocationStore", "AUTH_BLACKLIST_KEY_PREFIX"]

[[entry]]
path = "backend/crates/api/src/bin/wms_api.rs"
category = "runtime-composition"
required_terms = ["WMS_REDIS_URL", "RedisAuthRevocationStore::from_url"]

[[entry]]
path = "backend/crates/api/src/dual_person_policy.rs"
category = "runtime-policy-cache"
required_terms = ["with_redis_cache", "POLICY_CACHE_TTL_SECONDS"]

[[entry]]
path = "backend/crates/api/src/dual_person_policy_handlers.rs"
category = "runtime-policy-cache-wiring"
required_terms = ["with_redis_cache"]

[[entry]]
path = "backend/crates/api/src/system_dictionary_handlers.rs"
category = "runtime-cache-invalidation"
required_terms = ["with_postgres_and_redis", "invalidate_policy_cache"]

[[entry]]
path = "backend/crates/api/examples/wms_api_e2e.rs"
category = "e2e-runtime-wiring"
required_terms = ["WMS_REDIS_URL", "RedisAuthRevocationStore"]

[[entry]]
path = "backend/crates/api/tests/api_key_postgres.rs"
category = "test-fixture-text"
required_terms = ["redis"]

[[entry]]
path = "backend/crates/api/src/operation_context.rs"
category = "layering-guard-comment"
required_terms = ["Axum、Redis"]

[[entry]]
path = "backend/crates/domain/src/common.rs"
category = "generated-response-contract"
required_terms = ["Redis 不可用时为 true"]

[[entry]]
path = "apps/web-admin/src/pages/auth/H1SessionPage.tsx"
category = "frontend-display-copy"
required_terms = ["Redis 黑名单"]

[[entry]]
path = "packages/api-client/src/schema.ts"
category = "generated-api-schema"
required_terms = ["Redis 不可用时为 true"]

[[entry]]
path = "deploy/docker-compose.staging.yml"
category = "deployment"
required_terms = ["redis-staging:", "WMS_REDIS_URL=redis://redis-staging:6379/0"]
