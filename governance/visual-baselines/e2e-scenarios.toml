# Matrix E2E screenshot gate scenarios
#
# 目标：在 204 个 prototype tab 的 baseline 截图之外，补充 Playwright 级别的
# DOM / 交互 / 截图证据。manifest.toml 仍是 tab、viewport、baseline PNG 的唯一真相源；
# 本文件只声明 E2E 策略与少数特殊页加严规则。

[meta]
version = "v1"
scope = "full-matrix-204"
owner = "governance"
created_at = "2026-06-05"

[defaults]
required_selectors = ["header", "main"]
min_keyword_hit_ratio = 0.70
max_horizontal_overflow_px = 8
forbid_console_errors = true
detect_text_overflow = true
detect_control_overlap = true
detect_vertical_cjk_table = false
click_strategy = "first-main-button"
capture_states = ["initial", "after-interaction"]

[devices.pc]
required_selectors = ["header", "main"]
min_keyword_hit_ratio = 0.70

[devices.pda]
required_selectors = ["header", "main"]
min_keyword_hit_ratio = 0.60

[devices.pad]
required_selectors = ["header", "main"]
min_keyword_hit_ratio = 0.60

[devices.h5]
required_selectors = ["header", "main"]
min_keyword_hit_ratio = 0.60

[[overrides]]
name = "print-preview-readability"
match_globs = ["m4-manifest", "pc-m4-005", "pad-m4-005"]
required_selectors = ["header", "main", "text=药品随货同行单", "text=打印设置"]
min_keyword_hit_ratio = 0.75
detect_vertical_cjk_table = true
click_strategy = "first-main-button"

[[overrides]]
name = "component-gallery"
match_globs = ["gallery"]
required_selectors = ["header", "main", "text=组件库"]
min_keyword_hit_ratio = 0.80
click_strategy = "none"
