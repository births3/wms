[[deferred_stories]]
id = "US-H1-002"
title = "角色与权限管理"
module = "H1"
reason = "当前只落地角色、权限、用户绑定底层表和登录态权限读取；角色权限维护 API / UI、批量授权和权限即时变更操作未进入本轮执行。"

[[deferred_stories]]
id = "US-H1-005"
title = "Token 失效与登出"
module = "H1"
reason = "当前只落地 Redis token 黑名单和 permissions_changed_at 运行策略；登出 API、多设备会话列表和管理员强制踢人未进入本轮执行。"

[[deferred_stories]]
id = "US-H1-006"
title = "API Key 生命周期管理"
module = "H1"
reason = "当前没有 API Key 创建、轮换、吊销、作用域和审计接口；该能力应与 H-INT 外部系统接入切片一起设计和实现。"

[[deferred_stories]]
id = "US-H4-002"
title = "企业微信消息发送"
module = "H4"
reason = "当前仅完成参数维护、本地完整性测试、模板渲染和发送记录持久化；未接外部 provider 时记录明确为失败，禁止伪报发送成功。企业微信真实 API 调用、失败重试、token 刷新和外部联调证据尚未完成。"

[[deferred_stories]]
id = "US-H4-003"
title = "企业微信审批流对接"
module = "H4"
reason = "当前仅完成受 JWT 权限保护的内部审批记录和指定审批人回写模型；企业微信审批推送、外部回调签名校验、轮询兜底、业务单据原子回写和外部联调证据尚未完成。"

