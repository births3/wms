name: wms-dev-h2

services:
  postgres-dev-h2:
    image: postgres:16
    environment:
      POSTGRES_DB: wms_dev_h2
      POSTGRES_USER: wms_dev_h2
      POSTGRES_PASSWORD_FILE: /run/secrets/wms_dev_h2_db_password
    volumes:
      - postgres_dev_h2_data:/var/lib/postgresql/data
    ports:
      - "${WMS_DEV_H2_DB_PORT:-15432}:5432"
    secrets:
      - wms_dev_h2_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_dev_h2 -d wms_dev_h2"]
      interval: 10s
      timeout: 5s
      retries: 10

  wms-db-migrate-dev-h2:
    build:
      context: ..
      dockerfile: backend/Dockerfile.wms-api
    image: wms-api-dev-h2:${WMS_VERSION:-latest}
    pull_policy: build
    entrypoint: ["/app/wms-db-migrate"]
    depends_on:
      postgres-dev-h2:
        condition: service_healthy
    environment:
      - WMS_DB_URL=postgres://wms_dev_h2:${WMS_DEV_H2_DB_PASSWORD}@postgres-dev-h2:5432/wms_dev_h2
    restart: "no"

volumes:
  postgres_dev_h2_data:

secrets:
  wms_dev_h2_db_password:
    file: secrets/wms_dev_h2_db_password.txt
