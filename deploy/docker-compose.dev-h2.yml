name: wms-dev-h2

services:
  postgres-dev-h2:
    image: postgres:16
    environment:
      POSTGRES_DB: wms_dev_h2
      POSTGRES_USER: wms_dev_h2
      POSTGRES_PASSWORD_FILE: /run/secrets/wms_dev_h2_db_password
    volumes:
      - postgres_dev_h2_data:/var/lib/postgresql/data
    ports:
      - "${WMS_DEV_H2_DB_PORT:-15432}:5432"
    secrets:
      - wms_dev_h2_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_dev_h2 -d wms_dev_h2"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-dev-h2:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${WMS_HFILE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${WMS_HFILE_SECRET_KEY}
    volumes:
      - minio_dev_h2_data:/data
    ports:
      - "${WMS_DEV_HFILE_API_PORT:-19000}:9000"
      - "${WMS_DEV_HFILE_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init-dev-h2:
    image: minio/mc:RELEASE.2025-07-16T15-35-03Z
    depends_on:
      minio-dev-h2:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio-dev-h2:9000 "$${WMS_HFILE_ACCESS_KEY}" "$${WMS_HFILE_SECRET_KEY}" &&
        mc mb --ignore-existing local/wms-attachments &&
        mc anonymous set none local/wms-attachments
    environment:
      WMS_HFILE_ACCESS_KEY: ${WMS_HFILE_ACCESS_KEY}
      WMS_HFILE_SECRET_KEY: ${WMS_HFILE_SECRET_KEY}
    restart: "no"

  h9-render-worker-dev-h2:
    build:
      context: ..
      dockerfile: apps/h9-render-worker/dockerfile
    image: wms-h9-render-worker-dev-h2:${WMS_VERSION:-latest}
    pull_policy: build
    environment:
      WMS_H9_RENDER_HOST: 0.0.0.0
      WMS_H9_RENDER_PORT: 18090
      WMS_H9_RENDER_TOKEN: ${WMS_H9_RENDER_TOKEN}
    ports:
      - "${WMS_DEV_H9_RENDER_PORT:-18090}:18090"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18090/healthz').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  wms-db-migrate-dev-h2:
    build:
      context: ..
      dockerfile: backend/Dockerfile.wms-api
    image: wms-api-dev-h2:${WMS_VERSION:-latest}
    pull_policy: build
    entrypoint: ["/app/wms-db-migrate"]
    depends_on:
      postgres-dev-h2:
        condition: service_healthy
    environment:
      - WMS_DB_URL=postgres://wms_dev_h2:${WMS_DEV_H2_DB_PASSWORD}@postgres-dev-h2:5432/wms_dev_h2
    restart: "no"

volumes:
  postgres_dev_h2_data:
  minio_dev_h2_data:

secrets:
  wms_dev_h2_db_password:
    file: secrets/wms_dev_h2_db_password.txt
