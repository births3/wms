# Wave 1 file-backed Feature Flag registry.
#
# Runtime flags are intentionally minimal until a Wave task introduces a real
# guarded rollout. Each flag must include:
#   key, owner, created_at, cleanup_by, enabled
# and cleanup_by must be within 90 days of created_at.
#
# Example:
# [[flags]]
# key = "h1_auth_login_v1"
# owner = "platform"
# created_at = 2026-06-02
# cleanup_by = 2026-08-31
# enabled = false

[[flags]]
key = "m3_inventory_batches_config_center_smoke"
owner = "platform"
created_at = 2026-06-07
cleanup_by = 2026-09-05
enabled = true

[meta]
schema_version = "1"
source = "wave1-file"

# 设备中台：心跳超时阈值（秒）开关；数值经环境变量 DEVICE_HEARTBEAT_TIMEOUT_SECS 覆盖（默认 90）
[device.heartbeat_timeout_secs]
owner = "M1 设备中台"
created_at = "2026-08-20"
cleanup_by = "2026-12-31"
enabled = true
