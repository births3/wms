name: wms-staging

services:
  postgres-staging:
    image: postgres:16
    environment:
      POSTGRES_DB: wms_staging
      POSTGRES_USER: wms_staging
      POSTGRES_PASSWORD_FILE: /run/secrets/wms_staging_db_password
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    secrets:
      - wms_staging_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_staging -d wms_staging"]
      interval: 10s
      timeout: 5s
      retries: 10

  # REDIS-01：鉴权撤销替代任务完成前保留现有 staging 硬依赖；不新增其他 Redis 用途。
  redis-staging:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-staging:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${WMS_HFILE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${WMS_HFILE_SECRET_KEY}
    volumes:
      - minio_staging_data:/data
    ports:
      - "${WMS_STAGING_MINIO_API_PORT:-19000}:9000"
      - "${WMS_STAGING_MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init-staging:
    image: minio/mc:RELEASE.2025-07-16T15-35-03Z
    depends_on:
      minio-staging:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio-staging:9000 "$${WMS_HFILE_ACCESS_KEY}" "$${WMS_HFILE_SECRET_KEY}" &&
        mc mb --ignore-existing local/wms-attachments &&
        mc anonymous set none local/wms-attachments
    environment:
      WMS_HFILE_ACCESS_KEY: ${WMS_HFILE_ACCESS_KEY}
      WMS_HFILE_SECRET_KEY: ${WMS_HFILE_SECRET_KEY}
    restart: "no"

  h9-render-worker-staging:
    build:
      context: ..
      dockerfile: apps/h9-render-worker/dockerfile
    image: wms-h9-render-worker-staging:${WMS_VERSION:-latest}
    pull_policy: build
    environment:
      WMS_H9_RENDER_HOST: 0.0.0.0
      WMS_H9_RENDER_PORT: 18090
      WMS_H9_RENDER_TOKEN: ${WMS_H9_RENDER_TOKEN}
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18090/healthz').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  wms-db-migrate-staging:
    build:
      context: ..
      dockerfile: backend/Dockerfile.wms-api
    image: wms-api-staging:${WMS_VERSION:-latest}
    pull_policy: build
    entrypoint: ["/app/wms-db-migrate"]
    depends_on:
      postgres-staging:
        condition: service_healthy
    environment:
      - WMS_DB_URL=postgres://wms_staging:${WMS_STAGING_DB_PASSWORD}@postgres-staging:5432/wms_staging
    restart: "no"

  wms-api-staging:
    build:
      context: ..
      dockerfile: backend/Dockerfile.wms-api
    image: wms-api-staging:${WMS_VERSION:-latest}
    pull_policy: build
    depends_on:
      wms-db-migrate-staging:
        condition: service_completed_successfully
      redis-staging:
        condition: service_healthy
      minio-init-staging:
        condition: service_completed_successfully
    environment:
      - WMS_BIND_ADDR=0.0.0.0:8080
      - WMS_DB_URL=postgres://wms_staging:${WMS_STAGING_DB_PASSWORD}@postgres-staging:5432/wms_staging
      - WMS_REDIS_URL=redis://redis-staging:6379/0
      - WMS_FEATURE_FLAGS_FILE=/app/deploy/feature_flags.toml
      - WMS_JWT_SECRET=${WMS_JWT_SECRET}
      - WMS_H8_SECRET_ALIASES=${WMS_H8_SECRET_ALIASES}
      - H8_OWNER_CODE=${H8_OWNER_CODE:-ZBPF7}
      - WMS_HFILE_ENDPOINT=http://minio-staging:9000
      - WMS_HFILE_ACCESS_KEY=${WMS_HFILE_ACCESS_KEY}
      - WMS_HFILE_SECRET_KEY=${WMS_HFILE_SECRET_KEY}
      - WMS_HFILE_REGION=${WMS_HFILE_REGION:-us-east-1}
      - WMS_HFILE_BUCKET=wms-attachments
      - WMS_HFILE_SSE_MODE=none
      - WMS_H9_RENDER_WORKER_URL=http://h9-render-worker-staging:18090/render
      - WMS_H9_RENDER_TOKEN=${WMS_H9_RENDER_TOKEN}
    ports:
      - "${WMS_STAGING_API_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://wms-api-staging:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  h8-erp-worker-staging:
    build:
      context: ..
      dockerfile: backend/Dockerfile.h8-erp-worker
    image: wms-h8-erp-worker-staging:${WMS_VERSION:-latest}
    pull_policy: build
    depends_on:
      wms-api-staging:
        condition: service_healthy
    environment:
      - WMS_API_BASE=http://wms-api-staging:8080
      - WMS_API_TOKEN=${WMS_H8_WORKER_API_TOKEN}
      - WMS_DB_URL=postgres://wms_staging:${WMS_STAGING_DB_PASSWORD}@postgres-staging:5432/wms_staging
      - WMS_H8_SECRET_ALIASES=${WMS_H8_SECRET_ALIASES}
      - H8_CONNECTOR_ID=${H8_CONNECTOR_ID}
      - H8_OWNER_CODE=${H8_OWNER_CODE:-ZBPF7}
      - H8_WORKER_ID=${H8_WORKER_ID:-h8-erp-worker-staging}
      - H8_WORKER_VERSION=${WMS_VERSION:-latest}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/app/h8-erp-worker", "--healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  postgres_staging_data:
  redis_staging_data:
  minio_staging_data:

secrets:
  wms_staging_db_password:
    file: secrets/wms_staging_db_password.txt
