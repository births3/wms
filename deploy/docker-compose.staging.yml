name: wms-staging

services:
  postgres-staging:
    image: postgres:16
    environment:
      POSTGRES_DB: wms_staging
      POSTGRES_USER: wms_staging
      POSTGRES_PASSWORD_FILE: /run/secrets/wms_staging_db_password
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    secrets:
      - wms_staging_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_staging -d wms_staging"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-staging:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  wms-db-migrate-staging:
    build:
      context: ..
      dockerfile: backend/Dockerfile.wms-api
    image: wms-api-staging:${WMS_VERSION:-latest}
    pull_policy: build
    entrypoint: ["/app/wms-db-migrate"]
    depends_on:
      postgres-staging:
        condition: service_healthy
    environment:
      - WMS_DB_URL=postgres://wms_staging:${WMS_STAGING_DB_PASSWORD}@postgres-staging:5432/wms_staging
    restart: "no"

  wms-api-staging:
    build:
      context: ..
      dockerfile: backend/Dockerfile.wms-api
    image: wms-api-staging:${WMS_VERSION:-latest}
    pull_policy: build
    depends_on:
      wms-db-migrate-staging:
        condition: service_completed_successfully
      redis-staging:
        condition: service_healthy
    environment:
      - WMS_BIND_ADDR=0.0.0.0:8080
      - WMS_DB_URL=postgres://wms_staging:${WMS_STAGING_DB_PASSWORD}@postgres-staging:5432/wms_staging
      - WMS_REDIS_URL=redis://redis-staging:6379/0
      - WMS_FEATURE_FLAGS_FILE=/app/deploy/feature_flags.toml
      - WMS_JWT_SECRET=${WMS_JWT_SECRET}
    ports:
      - "${WMS_STAGING_API_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://wms-api-staging:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_staging_data:
  redis_staging_data:

secrets:
  wms_staging_db_password:
    file: secrets/wms_staging_db_password.txt
