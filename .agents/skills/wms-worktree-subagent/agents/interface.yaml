interface:
  display_name: WMS Worktree 子代理
  short_description: 用 codex exec 按写入 worktree、只读 worktree 或当前差异只读模式拆分 WMS 子任务。
  default_prompt: 请使用 WMS Worktree 子代理技能，为当前任务选择模式和模型，并定义边界、范围、验证、并行与收口规则。
compatibility:
  canonical_format: codex-skill
  adapter_targets:
    - codex
  activation:
    mode: description
  execution:
    context: inline
    shell: bash
  trust:
    source_tier: local
    remote_inline_execution: forbid
    remote_metadata_policy: ignore
  degradation:
    codex: 子代理不可用时，主代理仍按完整性矩阵、写入范围、验证和收口规则人工执行。
