interface:
  display_name: "WMS Retrospective"
  short_description: "Capture WMS execution misses"
  default_prompt: "Use $wms-execution-retrospective to fix this miss and capture the rule."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "metadata-only"
  degradation:
    openai: "metadata"
    generic: "source"
