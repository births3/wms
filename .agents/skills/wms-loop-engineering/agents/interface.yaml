interface:
  display_name: WMS Loop Engineering
  short_description: 用目标、检查、反馈和停止条件闭环执行 WMS 任务。
  default_prompt: 请使用 WMS Loop Engineering 技能，定义目标、输入边界、检查命令和停止条件后小步推进当前 WMS 任务。
compatibility:
  canonical_format: codex-skill
  adapter_targets:
    - codex
  activation:
    mode: description
  execution:
    context: inline
    shell: bash
  trust:
    source_tier: local
    remote_inline_execution: forbid
    remote_metadata_policy: ignore
  degradation:
    codex: 无法运行检查脚本时必须报告阻塞或残余风险，不能声明闭环完成。
