    - 分库分表决策矩阵 (v25): infra/sharding-decision-matrix.md
  - 评审记录:
    - 用户故事审计 v1-v10: reviews/user-stories-audit-2026-05-16.md
    - 波次参数对标 - Manhattan: reviews/wave-parameters-comparison-manhattan.md
    - 用户故事 Review 规范: review-guidelines-user-stories.md
    - Wave 0 回顾: retros/wave-0-retro.md
  - GSP 合规追溯:
    - 总索引: compliance/README.md
    - 第 5 章 质量管理体系: compliance/gsp-ch5-warehouse-management.md
    - 第 6 章 采购与验收: compliance/gsp-ch6-procurement-acceptance.md
    - 第 7 章 储存与养护: compliance/gsp-ch7-storage-maintenance.md
    - 第 8 章 销售与出库: compliance/gsp-ch8-sales-delivery.md
    - 冷链专项: compliance/gsp-ch9-cold-chain.md
    - 追溯与不合格品: compliance/gsp-ch10-traceability.md
    - 特殊药品 (v24): compliance/gsp-special-drugs.md
    - 字段追溯矩阵 (v25): compliance/gsp-field-traceability.md
    - 字段编码规范 (v2): compliance/gsp-field-coding-standards.md
    - 业务规则字段注册表 (v2): compliance/gsp-business-rules-registry.md
  - 治理:
    - 治理总文档: governance.md
    - 编码规范: coding-standards.md

# 额外配置
extra:
  generator: false               # 隐藏 "Made with Material for MkDocs"

# 排除不参与构建的文件
exclude_docs: |
  legacy-analysis/*
  retros/README.md
  adr/README.md.disabled
  domain/todo-legacy-comparison.md
  domain/.gitkeep
  compliance/.gitkeep

# Mermaid 渲染（v14 新增）
extra_javascript:
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js
  - js/mermaid-init.js
