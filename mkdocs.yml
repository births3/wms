site_name: WMS 用户故事文档
site_description: 医药冷链 GSP 合规仓储管理系统 — 用户故事 + 设计文档
site_author: WMS 项目组

# 路径配置
docs_dir: docs

# 主题
theme:
  name: material
  language: zh
  features:
    - navigation.tabs            # 顶部 tab 分类
    - navigation.tabs.sticky     # tab 跟随滚动
    - navigation.sections        # 侧边栏分组展开
    - navigation.expand          # 默认展开侧边栏
    - navigation.path            # 显示当前路径面包屑
    - navigation.indexes         # 分组首页（README.md 自动作为分组首页）
    - navigation.top             # 返回顶部按钮
    - search.highlight           # 搜索高亮
    - search.suggest             # 搜索建议
    - search.share               # 搜索结果分享
    - content.code.copy          # 代码复制按钮
    - toc.follow                 # 右侧目录跟随滚动
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换浅色模式
  icon:
    repo: fontawesome/brands/git-alt

# Markdown 扩展
markdown_extensions:
  - admonition                   # !!! note 提示框
  - attr_list                    # 给元素加属性
  - md_in_html                   # HTML 内嵌 markdown（折叠块用）
  - tables
  - footnotes
  - toc:
      permalink: true            # 标题旁锚点链接
  - pymdownx.details             # <details> 折叠块美化
  - pymdownx.superfences:        # 增强代码块（含 mermaid 自定义围栏）
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# 插件
plugins:
  - search:
      lang:
        - zh
        - en

# Hooks
hooks:
  - scripts/mkdocs_copy_md_hook.py

