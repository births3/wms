[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/api",
    "crates/openapi-export",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

[workspace.dependencies]
axum = "0.7"
aws-credential-types = "=1.2.14"
aws-sdk-s3 = "=1.127.0"
aws-types = "=1.3.14"
bcrypt = "0.19.2"
chrono = { version = "0.4", features = ["serde"] }
deadpool-tiberius-rustls = { version = "0.1.12", default-features = false, features = ["rustls", "tds73", "chrono"] }
hex = "0.4"
jsonwebtoken = "9"
lopdf = "0.38"
redis = { version = "0.27", features = ["aio", "tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync"] }
tracing = "0.1"
tower = { version = "0.5", features = ["util"] }
utoipa = { version = "4.2", features = ["chrono", "uuid"] }
uuid = { version = "1.10", features = ["serde", "v4"] }

wms-api = { path = "crates/api" }
wms-domain = { path = "crates/domain" }
