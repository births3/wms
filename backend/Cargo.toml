[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/api",
    "crates/customer-portal-api",
    "crates/openapi-export",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

[workspace.dependencies]
axum = "0.7"
base64 = "0.22"
bcrypt = "0.19.2"
chrono = { version = "0.4", features = ["serde"] }
deadpool-tiberius-rustls = { version = "0.1.12", default-features = false, features = ["rustls", "tds73", "chrono"] }
hex = "0.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
jsonwebtoken = "9"
kamadak-exif = "0.6.1"
printpdf = { version = "0.11.3", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
redis = { version = "0.27", features = ["aio", "tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
tracing = "0.1"
tower = { version = "0.5", features = ["util"] }
utoipa = { version = "4.2", features = ["chrono", "uuid"] }
uuid = { version = "1.10", features = ["serde", "v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

wms-api = { path = "crates/api" }
wms-domain = { path = "crates/domain" }
