# M-TC 追溯码模块 manifest
#
# 借鉴 Odoo __manifest__.py 模式（参见 docs/adr/0008-borrow-from-odoo.md §4）。
# 本文件是 29 个 manifest-bearing BC 之一；正式落地由治理脚本
# `check_module_dependencies.py`（Wave 0+ 待实现）扫描所有
# `domain/<module>/module-manifest.toml` 自动构建依赖图。

[module]
code = "M-TC"
name = "追溯码模块"
slug = "traceability-code"
version = "v3.1"
category = "horizontal-business"   # business | horizontal-business | horizontal-capability
owner = "架构/域模型负责人"

[depends]
# 业务依赖：本模块启用前必须先装这些模块
business = ["M1.master-data", "M-CG"]
# 横向能力依赖
horizontal = ["H1", "H2", "H4", "H8"]
# 外部数据预置（启用时由 lifecycle.post_install 加载）
external = ["barcodes_gs1_rules", "regulatory_code_20_rules"]

[wave]
# 计划启用波次（与 ROADMAP / ADR-0007 对齐）
target = "Wave 4"
parallel_track = "W4.D"

[stories]
# 本模块的用户故事文件
file = "docs/domain/user-stories-mtc-traceability-code.md"
count = 7

[data]
# 启用时按顺序加载的预置数据（Wave 4 实施时按本顺序）
gs1_nomenclature = "data/trace_code_nomenclature_gs1.toml"
regulatory_code_nomenclature = "data/trace_code_nomenclature_regulatory.toml"
trace_code_categories = "data/trace_code_categories.toml"

[lifecycle]
# 模块启用钩子（v3.1 概念，Wave 1+ 实现）
post_install = "post_init_load_gs1.sql"
pre_uninstall = "warn_no_uninstall_during_active_codes.sql"

[gsp]
# GSP 合规相关
relevant_clauses = ["追-1", "追-2", "追-3", "追-4", "追-5", "追-6", "8.111", "8.113"]
mandatory_for_china = true        # 中国医药 GSP 必需

[fields]
# 与 §6 字段词典 v3.1 关联的关键字段
canonicals = [
  "追溯码",
  "shipment_doc_no",
  "operation_type",
  "delivery_org_uscc",
  "shipper_org_uscc",
  "receiver_org_uscc",
]

# ── ADR-0012 限界上下文声明（v3.1 引入）──

[bounded_context]
code = "M-TC"
name = "追溯码模块"
language_model = ["TraceCode", "Nomenclature", "GTIN", "RegulatoryReport", "ApplicationIdentifier"]

[integrations]
# 与每个有依赖关系的 BC 声明 8 种 DDD 集成模式之一
M1 = "Conformist"               # 接受 M1 的商品定义
M-CG = "OHS"                    # 通过 M-CG 取追溯码序号
H1 = "OHS"                      # 通过 H1 鉴权
H2 = "OHS"                      # 通过 H2 审计
H4 = "OHS"                      # 通过 H4 上报失败时通知
H3 = "OHS"                      # 通过 H3 发布跨端契约
H8 = "ACL"                      # 通过 H8 隔离监管/ERP 外部模型
M3 = "OHS"                      # 读取库存批次与追溯状态
M-QL = "OHS"                    # 通过质量联系单处理异常/审批

[shared_kernel]
# 本 BC 不向外提供新的共享类型；消费 ADR-0012 §Shared Kernel 清单 9 类
provides = []
consumes = ["OwnerId", "TenantId", "ProductCode", "BatchNo", "OperatorId", "TraceId", "ErrorCode"]
