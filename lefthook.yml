# wms Git hooks 配置（lefthook）
#
# 详细规则见：docs/governance.md §2.2、ADR-0003 §机制 2
#
# 钩子与 Tier 对应：
#   pre-commit  → Tier 1（quick-check）
#   commit-msg  → Tier 1 子集（仅提交规范）
#   pre-push    → Tier 3（preflight）
#
# 安装：
#   1. 安装 lefthook: https://github.com/evilmartians/lefthook
#   2. 在仓库根运行: lefthook install
#
# 跳过（仅在紧急情况）：
#   git commit --no-verify   # 跳过 pre-commit 与 commit-msg
#   git push --no-verify     # 跳过 pre-push
#   跳过必须在 PR 描述中说明原因 + 后续补检

# ============================================================
# pre-commit: Tier 1 quick-check
# ============================================================
pre-commit:
  parallel: true
  commands:
    # 1. 格式 / lint / 提交规范（占位，等 Wave 1 工具链就位）
    quick-check:
      run: just quick-check
      stage_fixed: true

    # 2. secret 扫描（密钥不入库 — 红线）
    secret-scan:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --redact --no-banner
        else
          echo "  · gitleaks not installed, skipping secret scan (install recommended)"
        fi

# ============================================================
# commit-msg: 提交信息规范（Conventional Commits）
# ============================================================
commit-msg:
  commands:
    check-convention:
      run: python3 scripts/governance/check_commit_convention.py --file {1}

# ============================================================
# pre-push: Tier 3 preflight
# ============================================================
pre-push:
  commands:
    # 推送到 main 直接 reject（main 受保护）
    block-direct-push-main:
      run: |
        protected=$(git rev-parse --abbrev-ref --symbolic-full-name @{u} 2>/dev/null || echo "")
        current=$(git branch --show-current)
        if [ "$current" = "main" ]; then
          echo "✘ direct push to 'main' is not allowed; create a feature branch + PR"
          exit 1
        fi

    # Tier 3 preflight
    preflight:
      run: just preflight

# ============================================================
# 全局选项
# ============================================================
# 颜色输出 + 日志级别
output:
  - meta            # 显示钩子名
  - summary         # 显示总结
  - success         # 显示成功
  - failure         # 显示失败
  - execution       # 显示执行命令

# 跳过钩子的环境变量：LEFTHOOK=0 git commit
# CI 中默认禁用：LEFTHOOK=0
skip_output:
  - meta
