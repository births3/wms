name: PR2 one-shot CI optimization finalizer

"on":
  push:
    branches:
      - fix/governance-tier1-backlog-20260831

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/governance-tier1-backlog-20260831
          fetch-depth: 0

      - name: Apply final CI optimization
        run: python3 scripts/governance/finalize_ci_optimization.py

      - name: Remove staging artifacts and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/pr2-finalize-ci-optimization.yml \
            .github/workflows/pr2-ci-efficiency-finalize.yml \
            .github/workflows/.ci-finalization-lock \
            .github/ci-optimization-notes.tmp \
            tmp-ci-governance-preview.txt \
            scripts/governance/finalize_ci_optimization.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: finalize staged validation optimization"
          git push origin HEAD:fix/governance-tier1-backlog-20260831
