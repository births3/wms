name: PR2 one-shot E2E selector repair

on:
  push:
    branches:
      - fix/governance-tier1-backlog-20260831

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/governance-tier1-backlog-20260831
          fetch-depth: 0

      - name: Align H8 E2E selectors with the current UI
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}: {old!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          messages = "prototypes/e2e/web-admin-h8-messages-real.spec.ts"
          replace_once(
              messages,
              '  await page.getByLabel("消息类型", { exact: true }).selectOption("asn");',
              (
                  '  await page.locator(\'summary[aria-label="消息类型"]\').click();\n'
                  '  await page.getByRole("checkbox", { name: "预到货通知（ASN）", exact: true }).check();'
              ),
          )
          replace_once(
              messages,
              '  await page.getByLabel("通道", { exact: true }).selectOption("interface_table");',
              (
                  '  await page.locator(\'summary[aria-label="通道"]\').click();\n'
                  '  await page.getByRole("checkbox", { name: "接口表", exact: true }).check();'
              ),
          )
          replace_once(
              messages,
              '  await page.getByLabel("状态", { exact: true }).selectOption("dead");',
              (
                  '  await page.locator(\'summary[aria-label="状态"]\').click();\n'
                  '  await page.getByRole("checkbox", { name: "死信", exact: true }).check();'
              ),
          )
          replace_once(
              messages,
              '  await page.getByLabel("仓库", { exact: true }).selectOption(warehouseId);',
              (
                  '  await page.locator(\'summary[aria-label="仓库"]\').click();\n'
                  '  await page.getByRole("checkbox", { name: warehouseId, exact: true }).check();'
              ),
          )

          connectors = "prototypes/e2e/web-admin-h8-real.spec.ts"
          replace_once(
              connectors,
              '  await expect(page.getByText(/可维护/)).toBeVisible();',
              '  await expect(page.getByRole("button", { name: "新建连接", exact: true })).toBeVisible();',
          )
          replace_once(
              connectors,
              '  await expect(page.getByText(/集成中心 · US-H8-001 · .* · 只读 ·/)).toBeVisible();',
              '  await expect(page.getByText("只读可见连接", { exact: true })).toBeVisible();',
          )

      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr2-e2e-selector-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/e2e/web-admin-h8-messages-real.spec.ts prototypes/e2e/web-admin-h8-real.spec.ts .github/workflows/pr2-e2e-selector-repair.yml
          git diff --cached --check
          git commit -m "test(e2e): align H8 selectors with current controls"
          git push origin HEAD:fix/governance-tier1-backlog-20260831
