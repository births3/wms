name: t2-failure-diagnostic

"on":
  pull_request:

jobs:
  diff-governance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: taiki-e/install-action@just
      - name: Install governance dependencies
        run: python3 -m pip install -r requirements-governance.txt
      - name: Install workspace dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate
          pnpm install --frozen-lockfile
      - name: Run T2 diff-driven governance
        env:
          WMS_GOV_CONTEXT: pr
          WMS_GOV_BASE: origin/main
        run: python3 scripts/governance/task_check.py --tier T2 --strict

  rust-clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run workspace Clippy
        run: cargo clippy --manifest-path backend/Cargo.toml --workspace --all-targets --no-deps -- -D warnings -A clippy::too-many-arguments
