name: PR2 one-shot H-AL E2E repair

on:
  push:
    branches:
      - fix/governance-tier1-backlog-20260831

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/governance-tier1-backlog-20260831
          fetch-depth: 0

      - name: Align H-AL E2E assertions with the current production UI
        shell: python
        run: |
          from pathlib import Path

          path = Path("prototypes/e2e/web-admin-hal-real.spec.ts")
          text = path.read_text(encoding="utf-8")

          replacements = {
              '  await expect(page.locator("tbody tr")).toHaveCount(6);': (
                  '  const definitionTableBody = page.locator("tbody").first();\n'
                  '  await expect(definitionTableBody.locator("tr")).toHaveCount(6);'
              ),
              '  await expect(page.getByRole("heading", { name: "H-AL 告警升级规则" })).toBeVisible();': (
                  '  await expect(page.getByRole("heading", { name: "H-AL 升级规则" })).toBeVisible();'
              ),
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, found {count}: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr2-hal-e2e-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f prototypes/e2e/web-admin-hal-real.spec.ts
          git add .github/workflows/pr2-hal-e2e-repair.yml
          git diff --cached --check
          git commit -m "test(e2e): align H-AL assertions with current UI"
          git push origin HEAD:fix/governance-tier1-backlog-20260831
