name: PR Fast

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: pr-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-gate:
    name: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      RUST_BACKTRACE: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_INCREMENTAL: "false"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_INCREMENTAL: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed scopes
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="origin/${GITHUB_BASE_REF}"
          else
            git fetch origin main --depth=1
            base="origin/main"
          fi

          git diff --name-only "${base}...HEAD" > /tmp/pr-fast-changed-files.txt
          cat /tmp/pr-fast-changed-files.txt

          matches() {
            grep -qE "$1" /tmp/pr-fast-changed-files.txt
          }

          backend=false
          node=false
          frontend=false

          if matches '^backend/'; then
            backend=true
            # Unknown backend paths intentionally fall back to the complete T1 set,
            # whose environment checks may use workspace Node dependencies.
            node=true
          fi

          if matches '^(apps/|packages/|prototypes/|shared/openapi/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|.*package\.json$)'; then
            frontend=true
            node=true
          fi

          if matches '^(\.github/workflows/|scripts/governance/|governance/|justfile$)'; then
            node=true
          fi

          {
            echo "base=${base}"
            echo "backend=${backend}"
            echo "node=${node}"
            echo "frontend=${frontend}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### PR Fast scope"
            echo
            echo "- backend: \`${backend}\`"
            echo "- node/tooling: \`${node}\`"
            echo "- frontend: \`${frontend}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-governance.txt

      - name: Install governance dependencies
        run: python3 -m pip install -r requirements-governance.txt

      - name: Install gitleaks
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_checksums.txt
          grep 'gitleaks_8.21.2_linux_x64.tar.gz' gitleaks_8.21.2_checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz gitleaks
          mkdir -p "$HOME/.local/bin"
          mv gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Secret scan
        run: gitleaks detect --redact --no-banner

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.scope.outputs.backend == 'true' }}
        with:
          components: rustfmt

      - name: Rust format
        if: ${{ steps.scope.outputs.backend == 'true' }}
        run: cargo fmt --manifest-path backend/Cargo.toml --all --check

      - name: Cache Rust registry
        if: ${{ steps.scope.outputs.backend == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-v3-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v3-

      - uses: pnpm/action-setup@v4
        if: ${{ steps.scope.outputs.node == 'true' }}
        with:
          version: 11.5.2
          run_install: false

      - uses: actions/setup-node@v4
        if: ${{ steps.scope.outputs.node == 'true' }}
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        if: ${{ steps.scope.outputs.node == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Diff-driven T1 governance
        env:
          WMS_GOV_CONTEXT: pr
          WMS_GOV_BASE: ${{ steps.scope.outputs.base }}
        run: python3 scripts/governance/task_check.py --tier T1 --context pr --base "${WMS_GOV_BASE}" --strict

      - name: Diff-driven T2 governance
        env:
          WMS_GOV_CONTEXT: pr
          WMS_GOV_BASE: ${{ steps.scope.outputs.base }}
        run: python3 scripts/governance/task_check.py --tier T2 --context pr --base "${WMS_GOV_BASE}" --strict

      - name: Frontend self-checks
        if: ${{ steps.scope.outputs.frontend == 'true' }}
        run: pnpm --dir apps/web-admin run test:self-checks

      - name: JavaScript unit tests
        if: ${{ steps.scope.outputs.frontend == 'true' }}
        run: |
          node packages/ui/tests/dialog-dismiss.test.ts
          node packages/ui/tests/data-grid-advanced-filters.test.ts
          node packages/ui/tests/data-grid-filter-history.test.ts
          node packages/ui/tests/data-grid-pagination-prefetch.test.ts
          node packages/ui/tests/data-grid-views.test.ts
          node packages/ui/tests/query-panel-quick-filters.test.ts
          node packages/ui/tests/scroll-bar-math.test.ts
          node packages/ui/tests/viewport-math.test.ts
          node packages/ui/tests/scroll-bar-wiring.test.ts
          node packages/ui/tests/table-row-background.test.ts
          node packages/ui/tests/data-grid-layout-expand.test.ts
          node apps/web-admin/src/pages/inbound/inbound-document-entry-model.test.ts

      - name: TypeScript contracts
        if: ${{ steps.scope.outputs.frontend == 'true' }}
        run: |
          pnpm --dir apps/web-admin exec tsc --noEmit
          pnpm --dir packages/api-client run typecheck

      - name: Rust workspace check
        if: ${{ steps.scope.outputs.backend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == true) }}
        run: cargo check --manifest-path backend/Cargo.toml --workspace --all-targets --jobs 2

      - name: Verify checks did not rewrite tracked files
        if: ${{ always() }}
        run: |
          git diff --check
          git diff --exit-code
