name: pr2-source-repair-once

"on":
  push:
    branches:
      - fix/governance-tier1-backlog-20260831

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/governance-tier1-backlog-20260831
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str | Path, old: str, new: str, label: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"repair anchor missing ({label}) in {target}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          simple_replacements = [
              (
                  "backend/crates/domain/src/putaway_validation.rs",
                  '        assert!(is_temperature_zone_subset("cold_2_8", "cool_le_20") == false);',
                  '        assert!(!is_temperature_zone_subset("cold_2_8", "cool_le_20"));',
                  "temperature subset bool assertion",
              ),
              (
                  "backend/crates/domain/src/wcs_task.rs",
                  "        assert!(ptl_qty_diff_within_threshold(10, 1, 0.2, 10) == false); // ratio 0.9 > 0.2",
                  "        assert!(!ptl_qty_diff_within_threshold(10, 1, 0.2, 10)); // ratio 0.9 > 0.2",
                  "PTL threshold bool assertion",
              ),
              (
                  "backend/crates/api/src/master_data_postgres_part1.rs",
                  "        let row: Option<(Uuid, String, String, String, String, String, String, i64, i64)> = sqlx::query_as(",
                  "        type PdaLocationLookupRow = (\n"
                  "            Uuid, String, String, String, String, String, String, i64, i64,\n"
                  "        );\n"
                  "        let row: Option<PdaLocationLookupRow> = sqlx::query_as(",
                  "PDA location lookup row alias",
              ),
              (
                  "backend/crates/api/src/wave3_repository/putaway_validation.rs",
                  "product.map_or(false, |p| {",
                  "product.is_some_and(|p| {",
                  "special-drug Option predicate",
              ),
              (
                  "backend/crates/api/src/wave3_repository/putaway_validation.rs",
                  '.map_or(false, |c| c != "none" && c != "normal" && !c.is_empty())',
                  '.is_some_and(|c| c != "none" && c != "normal" && !c.is_empty())',
                  "special-drug category predicate",
              ),
              (
                  "backend/crates/api/src/wave3_repository/putaway_validation.rs",
                  "product.map_or(false, |p| p.is_external_use)",
                  "product.is_some_and(|p| p.is_external_use)",
                  "external-use Option predicate",
              ),
              (
                  "backend/crates/api/src/wave3_repository/putaway_validation.rs",
                  "product.map_or(false, |p| p.is_fragrant)",
                  "product.is_some_and(|p| p.is_fragrant)",
                  "fragrant Option predicate",
              ),
              (
                  "backend/crates/api/tests/phase1_location_batch_wizard_postgres.rs",
                  "    assert_eq!(first.is_agv_managed, false);",
                  "    assert!(!first.is_agv_managed);",
                  "location preview non-AGV assertion",
              ),
              (
                  "backend/crates/api/tests/phase1_location_batch_wizard_postgres.rs",
                  "    assert_eq!(loc_f2_g3.is_agv_managed, true);",
                  "    assert!(loc_f2_g3.is_agv_managed);",
                  "location floor-grid AGV assertion",
              ),
              (
                  "backend/crates/api/tests/phase1_location_batch_wizard_postgres.rs",
                  "    assert_eq!(loc_p2_f3_g4.is_agv_managed, true);",
                  "    assert!(loc_p2_f3_g4.is_agv_managed);",
                  "location position-floor-grid AGV assertion",
              ),
              (
                  "backend/crates/api/tests/phase1_location_batch_wizard_postgres.rs",
                  "    assert_eq!(res.locations[0].allows_container, false);",
                  "    assert!(!res.locations[0].allows_container);",
                  "location container permission assertion",
              ),
              (
                  "backend/crates/api/tests/pda_consistency_repairs_postgres.rs",
                  """    let approval: (
                  String,
                  Option<Uuid>,
                  Option<chrono::DateTime<Utc>>,
                  Option<String>,
                  Option<String>,
                  Option<String>,
                  chrono::DateTime<Utc>,
                  chrono::DateTime<Utc>,
              ) = sqlx::query_as(""",
                  """    type QuickSpotApprovalRow = (
                  String,
                  Option<Uuid>,
                  Option<chrono::DateTime<Utc>>,
                  Option<String>,
                  Option<String>,
                  Option<String>,
                  chrono::DateTime<Utc>,
                  chrono::DateTime<Utc>,
              );
              let approval: QuickSpotApprovalRow = sqlx::query_as(""",
                  "quick-spot approval row alias",
              ),
          ]
          for replacement in simple_replacements:
              replace_once(*replacement)

          openapi_path = Path("backend/crates/api/src/openapi_paths/inventory_count.rs")
          openapi = openapi_path.read_text(encoding="utf-8")
          openapi = openapi.replace(
              "use wms_domain::{PdaLocationInfo, QuickSpotCountRequest, QuickSpotCountResponse};\n",
              "",
              1,
          )
          openapi = openapi.replace(
              "request_body = QuickSpotCountRequest,",
              "request_body = wms_domain::QuickSpotCountRequest,",
              1,
          )
          openapi = openapi.replace(
              "body = QuickSpotCountResponse)",
              "body = wms_domain::QuickSpotCountResponse)",
              1,
          )
          openapi = openapi.replace(
              "body = PdaLocationInfo)",
              "body = wms_domain::PdaLocationInfo)",
              1,
          )
          for required in (
              "request_body = wms_domain::QuickSpotCountRequest,",
              "body = wms_domain::QuickSpotCountResponse)",
              "body = wms_domain::PdaLocationInfo)",
          ):
              if required not in openapi:
                  raise SystemExit(f"OpenAPI type qualification missing: {required}")
          openapi_path.write_text(openapi, encoding="utf-8")

          # Integration-test helper modules are compiled independently by every test crate;
          # each crate intentionally consumes only a subset of the shared helpers.
          for support_path in (
              Path("backend/crates/api/tests/support/lpn_container.rs"),
              Path("backend/crates/api/tests/postgres_test_support/mod.rs"),
          ):
              text = support_path.read_text(encoding="utf-8")
              module_allow = "#![allow(dead_code)]\n\n"
              if not text.startswith(module_allow):
                  support_path.write_text(module_allow + text, encoding="utf-8")

          # Keep production items before the test module instead of suppressing
          # clippy::items_after_test_module.
          inventory_path = Path("backend/crates/api/src/inventory.rs")
          inventory = inventory_path.read_text(encoding="utf-8")
          test_marker = "#[cfg(test)]\nmod tests {"
          production_marker = "/// 设备中台 PTL 拍灯/称重/RFID 确认的上架落账"
          test_start = inventory.index(test_marker)
          production_start = inventory.index(production_marker)
          if test_start < production_start:
              tests = inventory[test_start:production_start].rstrip()
              inventory_path.write_text(
                  inventory[:test_start].rstrip()
                  + "\n\n"
                  + inventory[production_start:].rstrip()
                  + "\n\n"
                  + tests
                  + "\n",
                  encoding="utf-8",
              )

          baseline_path = Path("governance/backend-module-fragments-baseline.toml")
          baseline = baseline_path.read_text(encoding="utf-8")
          pda_entry = '''[[fragments]]
          parent = "backend/crates/api/src/wave4_repository.rs"
          include = "wave4_repository_pda.rs"

          '''
          if pda_entry not in baseline:
              anchor = '''[[fragments]]
          parent = "backend/crates/api/src/wave4_repository.rs"
          include = "wave4_repository_customer_portal.rs"

          '''
              if anchor not in baseline:
                  raise SystemExit("backend module baseline insertion anchor missing")
              baseline_path.write_text(
                  baseline.replace(anchor, anchor + pda_entry, 1),
                  encoding="utf-8",
              )

          Path("backend/crates/api/tests/openapi_pda_runtime.rs").write_text(
              '''use serde_json::Value;
          use utoipa::OpenApi;
          use wms_api::ApiDoc;

          #[test]
          fn pda_runtime_openapi_registrations_are_complete() {
              let document = serde_json::to_value(ApiDoc::openapi())
                  .expect("OpenAPI document should serialize");
              let paths = document
                  .get("paths")
                  .and_then(Value::as_object)
                  .expect("OpenAPI document should contain paths");

              for (path, method) in [
                  ("/api/v1/master-data/locations/by-code/{location_code}", "get"),
                  ("/api/v1/inventory/counts/quick-spot-count", "post"),
              ] {
                  assert!(
                      paths.get(path).and_then(|item| item.get(method)).is_some(),
                      "missing OpenAPI operation: {} {}",
                      method.to_uppercase(),
                      path
                  );
              }

              let schemas = document
                  .get("components")
                  .and_then(|value| value.get("schemas"))
                  .and_then(Value::as_object)
                  .expect("OpenAPI document should contain component schemas");
              for schema in [
                  "PdaLocationInfo",
                  "QuickSpotCountRequest",
                  "QuickSpotCountResponse",
              ] {
                  assert!(schemas.contains_key(schema), "missing OpenAPI schema: {schema}");
              }
          }
          ''',
              encoding="utf-8",
          )
          PY
          cargo fmt --manifest-path backend/Cargo.toml --all
      - name: Verify repaired governance evidence
        run: |
          python3 scripts/governance/check_backend_module_fragments.py
          python3 scripts/governance/check_handler_test_coverage.py
          git diff --check
      - name: Verify workspace Clippy
        run: cargo clippy --manifest-path backend/Cargo.toml --workspace --all-targets --no-deps -- -D warnings -A clippy::too-many-arguments
      - name: Commit repaired sources
        run: |
          if git diff --quiet; then
            echo "PR #2 source fixes are already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/crates/api/src/inventory.rs \
            backend/crates/api/src/master_data_postgres_part1.rs \
            backend/crates/api/src/openapi_paths/inventory_count.rs \
            backend/crates/api/src/wave3_repository/putaway_validation.rs \
            backend/crates/api/tests/openapi_pda_runtime.rs \
            backend/crates/api/tests/pda_consistency_repairs_postgres.rs \
            backend/crates/api/tests/phase1_location_batch_wizard_postgres.rs \
            backend/crates/api/tests/postgres_test_support/mod.rs \
            backend/crates/api/tests/support/lpn_container.rs \
            backend/crates/domain/src/putaway_validation.rs \
            backend/crates/domain/src/wcs_task.rs \
            governance/backend-module-fragments-baseline.toml
          git commit -m "修复: 收口 PR #2 后端与 OpenAPI 门禁"
          git push origin HEAD:fix/governance-tier1-backlog-20260831
