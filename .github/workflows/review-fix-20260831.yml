name: Review Fix PDA Consistency

on:
  push:
    branches:
      - fix/review-20260831-pda-consistency

permissions:
  contents: write

concurrency:
  group: review-fix-20260831-pda-consistency
  cancel-in-progress: false

jobs:
  repair-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[review-fix applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_INCREMENTAL: "false"

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/review-20260831-pda-consistency
          fetch-depth: 0

      - name: Prepare Rust formatter
        run: rustup component add rustfmt

      - name: Decode and apply reviewed repair
        shell: bash
        run: |
          set -euo pipefail
          cat .github/review-fix-payload-*.b64 | tr -d '\n' > /tmp/review-fix-payload.b64
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          encoded = Path('/tmp/review-fix-payload.b64').read_text(encoding='utf-8').strip()
          source = gzip.decompress(base64.b64decode(encoded))
          Path('/tmp/review_fix_20260831.py').write_bytes(source)
          PY
          python3 /tmp/review_fix_20260831.py

          # PostgreSQL TIMESTAMPTZ persists microseconds. Keep the test strict at
          # the database's real precision instead of chrono's nanosecond precision.
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/crates/api/tests/pda_consistency_repairs_postgres.rs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'assert_eq!(approval.6, server_now - Duration::minutes(3));': (
                  'assert_eq!(\n'
                  '        approval.6.timestamp_micros(),\n'
                  '        (server_now - Duration::minutes(3)).timestamp_micros()\n'
                  '    );'
              ),
              'assert_eq!(approval.7, server_now);': (
                  'assert_eq!(approval.7.timestamp_micros(), server_now.timestamp_micros());'
              ),
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected assertion not found exactly once: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Format and whitespace checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path backend/Cargo.toml --all
          python3 - <<'PY'
          from pathlib import Path

          for path in [
              Path('backend/crates/api/src/wave4_repository_actions.rs'),
          ]:
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check

      - name: Compile workspace
        run: cargo check --manifest-path backend/Cargo.toml --workspace --all-targets

      - name: Run backend unit tests
        run: cargo test --manifest-path backend/Cargo.toml -p wms-api --lib

      - name: Run PDA consistency integration tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path backend/Cargo.toml -p wms-api \
            --test pda_enhancements_postgres \
            --test pda_consistency_repairs_postgres \
            -- --nocapture 2>&1 | tee /tmp/pda-consistency-integration.log

      - name: Upload integration test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pda-consistency-integration-log
          path: /tmp/pda-consistency-integration.log
          if-no-files-found: warn
          retention-days: 3

      - name: Run governance Tier 1
        run: python3 scripts/governance/governance_checks.py --tier T1

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/review-fix-payload-*.b64
          rm -f .github/workflows/review-fix-20260831.yml
          git config user.name "review-fix-bot"
          git config user.email "review-fix-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "修复(后端)：收口 PDA 作业一致性 [review-fix applied]"
          git push origin HEAD:fix/review-20260831-pda-consistency
