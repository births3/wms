name: governance

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CI: "true"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: taiki-e/install-action@just

      - name: Install gitleaks
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_checksums.txt
          grep 'gitleaks_8.21.2_linux_x64.tar.gz' gitleaks_8.21.2_checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz gitleaks
          mkdir -p "$HOME/.local/bin"
          mv gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Secret scan
        run: gitleaks detect --redact --no-banner

      - name: Install governance dependencies
        run: python3 -m pip install -r requirements-governance.txt

      - name: Install workspace dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate
          pnpm install --frozen-lockfile

      - name: Start PostgreSQL for T3/T4
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          echo "DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@127.0.0.1:5432/wms_test" >> "$GITHUB_ENV"
          echo "WMS_DB_URL=postgres://postgres:${POSTGRES_PASSWORD}@127.0.0.1:5432/wms_test" >> "$GITHUB_ENV"
          docker run --detach --rm --name wms-governance-postgres \
            --env POSTGRES_PASSWORD \
            --env POSTGRES_DB=wms_test \
            --publish 5432:5432 \
            postgres:18
          for attempt in $(seq 1 30); do
            if docker exec wms-governance-postgres pg_isready --username postgres --dbname wms_test; then
              exit 0
            fi
            sleep 1
          done
          docker logs wms-governance-postgres
          exit 1

      - name: Apply PostgreSQL migrations for T3/T4
        if: ${{ github.event_name != 'pull_request' }}
        run: cargo run --quiet --manifest-path backend/Cargo.toml --package wms-api --bin wms-db-migrate

      - name: Install Chromium for T3/T4
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm --dir prototypes exec playwright install --with-deps chromium

      - name: Warm OpenAPI exporter
        if: ${{ github.event_name == 'pull_request' }}
        run: cargo build --manifest-path backend/Cargo.toml --package openapi-export

      - name: Verify OpenAPI runtime registrations
        if: ${{ github.event_name == 'pull_request' }}
        run: cargo test --manifest-path backend/Cargo.toml --package wms-api --test openapi_pda_runtime

      - name: Verify generated OpenAPI contracts
        id: t2_openapi
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 scripts/governance/check_openapi_in_sync.py --strict
          python3 scripts/governance/validate_openapi_artifacts.py
          python3 scripts/governance/check_openapi_contract.py
          git diff --check
          git diff --exit-code

      - name: Full T1 governance
        id: t1_governance
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: python3 scripts/governance/governance_checks.py --tier T1

      - name: T2 Rust format
        id: t2_fmt
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: cargo fmt --manifest-path backend/Cargo.toml --all --check

      - name: T2 diff-driven governance
        id: t2_diff
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          WMS_GOV_CONTEXT: pr
          WMS_GOV_BASE: origin/main
        run: python3 scripts/governance/task_check.py --tier T2 --context pr --base origin/main --strict

      - name: T2 Rust clippy
        id: t2_clippy
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: cargo clippy --manifest-path backend/Cargo.toml --workspace --all-targets --no-deps -- -D warnings -A clippy::too-many-arguments

      - name: T2 backend unit tests
        id: t2_backend_tests
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          set +e
          cargo test \
            --manifest-path backend/Cargo.toml \
            --workspace --lib --no-fail-fast -- --nocapture \
            2>&1 | tee /tmp/backend-unit-tests.log
          status=${PIPESTATUS[0]}
          set -e

          echo "=== backend unit test failure summary ==="
          grep -nE 'panicked at|test result: FAILED|^failures:|^    [^ ]+::[^ ]+$|error: test failed|FAILED$' \
            /tmp/backend-unit-tests.log | tail -200 || true

          {
            echo '## Backend unit-test failure summary'
            echo
            echo '```text'
            grep -nE 'panicked at|test result: FAILED|^failures:|^    [^ ]+::[^ ]+$|error: test failed|FAILED$' \
              /tmp/backend-unit-tests.log | tail -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      - name: T2 web-admin self-checks
        id: t2_web_checks
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: pnpm --dir apps/web-admin run test:self-checks

      - name: T2 JavaScript unit tests
        id: t2_js_tests
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          node packages/ui/tests/dialog-dismiss.test.ts
          node packages/ui/tests/data-grid-advanced-filters.test.ts
          node packages/ui/tests/data-grid-filter-history.test.ts
          node packages/ui/tests/data-grid-pagination-prefetch.test.ts
          node packages/ui/tests/data-grid-views.test.ts
          node packages/ui/tests/query-panel-quick-filters.test.ts
          node packages/ui/tests/scroll-bar-math.test.ts
          node packages/ui/tests/viewport-math.test.ts
          node packages/ui/tests/scroll-bar-wiring.test.ts
          node packages/ui/tests/table-row-background.test.ts
          node packages/ui/tests/data-grid-layout-expand.test.ts
          node apps/web-admin/src/pages/inbound/inbound-document-entry-model.test.ts

      - name: T2 TypeScript contracts
        id: t2_ts_contracts
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          pnpm --dir apps/web-admin exec tsc --noEmit
          pnpm --dir packages/api-client run typecheck

      - name: T2 gate summary
        id: t2_summary
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          T1_GOVERNANCE: ${{ steps.t1_governance.outcome }}
          T2_FMT: ${{ steps.t2_fmt.outcome }}
          T2_DIFF: ${{ steps.t2_diff.outcome }}
          T2_CLIPPY: ${{ steps.t2_clippy.outcome }}
          T2_BACKEND_TESTS: ${{ steps.t2_backend_tests.outcome }}
          T2_WEB_CHECKS: ${{ steps.t2_web_checks.outcome }}
          T2_JS_TESTS: ${{ steps.t2_js_tests.outcome }}
          T2_TS_CONTRACTS: ${{ steps.t2_ts_contracts.outcome }}
          T2_OPENAPI: ${{ steps.t2_openapi.outcome }}
        run: |
          failed=0
          for name in \
            T1_GOVERNANCE T2_FMT T2_DIFF T2_CLIPPY T2_BACKEND_TESTS \
            T2_WEB_CHECKS T2_JS_TESTS T2_TS_CONTRACTS T2_OPENAPI
          do
            outcome="${!name}"
            printf '%-20s %s\n' "$name" "$outcome"
            if [[ "$outcome" != "success" ]]; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Risk-triggered T3 governance
        if: ${{ github.event_name == 'pull_request' && steps.t2_summary.outcome == 'success' }}
        env:
          WMS_GOV_CONTEXT: pr
          WMS_GOV_BASE: origin/main
        run: python3 scripts/governance/task_check.py --tier T3 --context pr --base origin/main --strict

      - name: Verify PR checks did not rewrite tracked files
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          git diff --check
          git diff --exit-code

      - name: Main preflight
        if: ${{ github.event_name == 'push' }}
        env:
          WMS_GOV_CONTEXT: main
        run: just preflight

      - name: T4 and release evidence
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          WMS_GOV_CONTEXT: release
        run: just verify

      - name: Stop PostgreSQL
        if: ${{ always() && github.event_name != 'pull_request' }}
        run: docker rm --force wms-governance-postgres || true
