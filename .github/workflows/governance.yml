name: governance

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  governance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: taiki-e/install-action@just
      - name: Install gitleaks
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_checksums.txt
          grep 'gitleaks_8.21.2_linux_x64.tar.gz' gitleaks_8.21.2_checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz gitleaks
          mkdir -p "$HOME/.local/bin"
          mv gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install governance dependencies
        run: python3 -m pip install -r requirements-governance.txt
      - name: Install workspace dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate
          pnpm install --frozen-lockfile
      - name: Start PostgreSQL for T3/T4
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          echo "DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@127.0.0.1:5432/wms_test" >> "$GITHUB_ENV"
          docker run --detach --rm --name wms-governance-postgres \
            --env POSTGRES_PASSWORD \
            --env POSTGRES_DB=wms_test \
            --publish 5432:5432 \
            postgres:18
          for attempt in $(seq 1 30); do
            if docker exec wms-governance-postgres pg_isready --username postgres --dbname wms_test; then
              exit 0
            fi
            sleep 1
          done
          docker logs wms-governance-postgres
          exit 1
      - name: Install Chromium for T3/T4
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm --dir prototypes exec playwright install --with-deps chromium
      - name: Secret scan
        run: gitleaks detect --redact --no-banner
      - name: Repair missing OpenAPI runtime registrations
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"OpenAPI repair anchor missing ({label}): {old!r}")
              return text.replace(old, new, 1)

          path_file = Path("backend/crates/api/src/openapi_paths/inventory_count.rs")
          path_text = path_file.read_text(encoding="utf-8")
          import_line = (
              "use wms_domain::{PdaLocationInfo, QuickSpotCountRequest, "
              "QuickSpotCountResponse};\n"
          )
          if import_line not in path_text:
              path_text = replace_once(
                  path_text,
                  "use super::*;\n",
                  "use super::*;\n" + import_line,
                  "inventory-count explicit schema imports",
              )

          if "pub(crate) fn quick_spot_count()" not in path_text:
              path_text += r'''

          #[utoipa::path(
              post,
              path = "/api/v1/inventory/counts/quick-spot-count",
              tag = "inventory-count",
              params(("Idempotency-Key" = String, Header, description = "客户端生成的幂等键")),
              request_body = QuickSpotCountRequest,
              responses(
                  (status = 200, description = "按库位与商品执行快速抽盘并返回差异", body = QuickSpotCountResponse),
                  (status = 400, description = "缺少幂等键", body = ErrorResponse),
                  (status = 401, description = "未登录", body = ErrorResponse),
                  (status = 403, description = "无盘点执行权限", body = ErrorResponse),
                  (status = 409, description = "幂等键冲突", body = ErrorResponse),
                  (status = 422, description = "库位、商品、批号或数量非法", body = ErrorResponse),
              )
          )]
          #[allow(dead_code)]
          pub(crate) fn quick_spot_count() {}
          '''

          if "pub(crate) fn get_location_by_code()" not in path_text:
              path_text += r'''

          #[utoipa::path(
              get,
              path = "/api/v1/master-data/locations/by-code/{location_code}",
              tag = "master-data",
              params(("location_code" = String, Path, description = "库位编码")),
              responses(
                  (status = 200, description = "按编码获取 PDA 库位信息", body = PdaLocationInfo),
                  (status = 401, description = "未登录", body = ErrorResponse),
                  (status = 403, description = "无基础档案读取权限", body = ErrorResponse),
                  (status = 404, description = "库位不存在", body = ErrorResponse),
              )
          )]
          #[allow(dead_code)]
          pub(crate) fn get_location_by_code() {}
          '''

          path_file.write_text(path_text, encoding="utf-8")

          doc_file = Path("backend/crates/api/src/openapi_doc.rs")
          doc_text = doc_file.read_text(encoding="utf-8")
          doc_text = replace_once(
              doc_text,
              "    OutboundColdChainPackage, OutboundShipment, PickReplenishmentTaskRequest,\n",
              "    OutboundColdChainPackage, OutboundShipment, PdaLocationInfo, "
              "PickReplenishmentTaskRequest,\n"
              "    QuickSpotCountRequest, QuickSpotCountResponse,\n",
              "OpenAPI document schema imports",
          )
          doc_text = replace_once(
              doc_text,
              "        list_locations,\n        create_location,",
              "        list_locations,\n        get_location_by_code,\n        create_location,",
              "location-by-code path registration",
          )
          doc_text = replace_once(
              doc_text,
              "        create_inventory_count,\n        get_inventory_count,",
              "        create_inventory_count,\n        quick_spot_count,\n        get_inventory_count,",
              "quick-spot-count path registration",
          )
          doc_text = replace_once(
              doc_text,
              "        ApproveInventoryCountRequest,\n"
              "        CreateInventoryCountRequest,\n"
              "        InventoryCount,",
              "        ApproveInventoryCountRequest,\n"
              "        CreateInventoryCountRequest,\n"
              "        PdaLocationInfo,\n"
              "        QuickSpotCountRequest,\n"
              "        QuickSpotCountResponse,\n"
              "        InventoryCount,",
              "explicit inventory and PDA component schemas",
          )
          doc_file.write_text(doc_text, encoding="utf-8")
          PY
          cargo fmt --manifest-path backend/Cargo.toml --all
      - name: Warm OpenAPI exporter for T2
        if: ${{ github.event_name == 'pull_request' }}
        run: cargo build --manifest-path backend/Cargo.toml --package openapi-export
      - name: Synchronize and commit generated OpenAPI contract
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          cd backend
          cargo run --quiet --bin openapi-export > ../shared/openapi/openapi.json
          cd ..
          python3 - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(Path("shared/openapi/openapi.json").read_text(encoding="utf-8"))
          schemas = document.get("components", {}).get("schemas", {})
          required_schemas = {
              "PdaLocationInfo",
              "QuickSpotCountRequest",
              "QuickSpotCountResponse",
          }
          missing_schemas = sorted(required_schemas - set(schemas))
          if missing_schemas:
              raise SystemExit(f"generated OpenAPI is missing schemas: {missing_schemas}")

          required_operations = {
              ("/api/v1/master-data/locations/by-code/{location_code}", "get"),
              ("/api/v1/inventory/counts/quick-spot-count", "post"),
          }
          paths = document.get("paths", {})
          missing_operations = sorted(
              f"{method.upper()} {path}"
              for path, method in required_operations
              if method not in paths.get(path, {})
          )
          if missing_operations:
              raise SystemExit(f"generated OpenAPI is missing operations: {missing_operations}")
          print("OpenAPI runtime operations and component schemas are complete")
          PY
          pnpm --filter @wms/api-client gen:schema
          pnpm --dir apps/customer-portal run gen:schema
          git diff --check
          if git diff --quiet; then
            echo "OpenAPI runtime registrations already synchronized"
            exit 0
          fi
          python3 - <<'PY'
          import subprocess

          allowed_exact = {
              "backend/crates/api/src/openapi_doc.rs",
              "backend/crates/api/src/openapi_paths/inventory_count.rs",
              "shared/openapi/openapi.json",
          }
          allowed_prefixes = ("packages/api-client/", "apps/customer-portal/")
          changed = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()
          unexpected = [
              path for path in changed
              if path not in allowed_exact and not path.startswith(allowed_prefixes)
          ]
          if unexpected:
              raise SystemExit(f"unexpected files changed during OpenAPI sync: {unexpected}")
          print("OpenAPI sync changed only approved source and generated artifacts")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/crates/api/src/openapi_doc.rs \
            backend/crates/api/src/openapi_paths/inventory_count.rs \
            shared/openapi/openapi.json \
            packages/api-client \
            apps/customer-portal
          git commit -m "修复: 补齐运行时 OpenAPI 契约"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Full T1 governance
        if: ${{ github.event_name == 'pull_request' }}
        run: python3 scripts/governance/governance_checks.py --tier T1
      - name: T1/T2 task gate
        if: ${{ github.event_name == 'pull_request' }}
        env:
          WMS_GOV_CONTEXT: pr
          WMS_GOV_BASE: origin/main
        run: just task-check
      - name: Risk-triggered T3 governance
        if: ${{ github.event_name == 'pull_request' }}
        run: python3 scripts/governance/task_check.py --tier T3 --context pr --base origin/main --strict
      - name: Main preflight
        if: ${{ github.event_name == 'push' }}
        env:
          WMS_GOV_CONTEXT: main
        run: just preflight
      - name: T4 and release evidence
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          WMS_GOV_CONTEXT: release
        run: just verify
