[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/api",
    "crates/openapi-export",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["serde", "v4"] }
utoipa = { version = "4.2", features = ["chrono", "uuid"] }

# 本 workspace 内的 crate（用 path 引用）
wms-domain = { path = "crates/domain" }
wms-api = { path = "crates/api" }
