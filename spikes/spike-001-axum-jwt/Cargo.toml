[package]
name = "spike-001-axum-jwt"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "spike_001_axum_jwt"
path = "src/lib.rs"

[[bin]]
name = "spike-001-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.3"
uuid = { version = "1.10", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
